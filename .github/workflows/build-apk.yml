name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and download SDK 52 native template tarball
        run: |
          npm install
          npx expo install --fix
          npm pack expo-template-bare-minimum@52

      - name: Generate native Android project (Prebuild)
        env:
          CI: '1'
        run: |
          TEMPLATE_TGZ=$(ls expo-template-bare-minimum-*.tgz | head -n 1)
          npx expo prebuild --platform android --clean --no-install --template "./$TEMPLATE_TGZ"
          ls -la android/gradlew

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCare-Adhere-ET-OCR-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14