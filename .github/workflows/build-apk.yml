name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install & Build React Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ቦኖ አዲስ" "com.bonoaddis.pos" --web-dir=dist || true
          npx cap add android || true
          npx cap sync android
          cp public/logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp public/logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png || true
          echo 'dependencies { implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22") }' >> android/app/build.gradle

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bono-addis-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
